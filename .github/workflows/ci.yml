name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Calidad de código (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formato
        run: ruff format --check .

  security:
    name: Seguridad (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit pip-audit
      - name: Bandit (análisis estático de seguridad)
        run: |
          if git ls-files '*.py' | grep -q .; then
            bandit -r . -x ./tests,./.venv,./venv -ll
          else
            echo "No hay archivos Python todavía, se omite"
          fi
      - name: pip-audit (vulnerabilidades en dependencias)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "No hay requirements.txt, se omite"
          fi

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  test:
    name: Tests Django
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install coverage
      - name: Checks de Django
        if: hashFiles('manage.py') != ''
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests con cobertura
        if: hashFiles('manage.py') != ''
        run: |
          coverage run manage.py test
          coverage report

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, security, dependency-review, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todos los jobs pasaron
        run: |
          echo "Resultados: ${{ join(needs.*.result, ', ') }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
